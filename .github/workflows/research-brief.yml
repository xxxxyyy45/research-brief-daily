name: Research Brief

on:
  schedule:
    # Start at 08:00 Rome; retry later if a schedule event is missed.
    - cron: "0,17,37,57 6-20 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Search window in days (daily run pushes only the current day)"
        required: false
        default: "1"
      send_email:
        description: "Send email"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      import_zotero:
        description: "Import selected papers to Zotero"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      force_send:
        description: "Re-send today's mail even though the ledger already recorded it"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

# The scheduled run and the hand-triggered one must never mail the same day twice.
# Queueing, not cancelling, keeps the second attempt after the first one has committed
# its mail ledger, so the ledger check sees the mail that was already delivered.
concurrency:
  group: research-brief-daily
  cancel-in-progress: false

jobs:
  delivery-time:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.clock.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - id: clock
        run: |
          python - <<'PY'
          import datetime as dt, os, json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo('Europe/Rome'))
          ledger_path = Path('automation/mail_ledger.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8-sig')) if ledger_path.exists() else {'sent': []}
          sent = any(item.get('date') == now.date().isoformat() and item.get('kind') == 'daily' for item in ledger.get('sent', []))
          due = 8 <= now.hour < 23 and not sent
          print('Already sent today; skipping' if sent else 'Checking delivery window')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"due={str(due).lower()}\n")
          PY

  generate-brief:
    needs: delivery-time
    if: github.event_name == 'workflow_dispatch' || needs.delivery-time.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rendering dependencies
        # Pillow renders the long digest image; python-docx is optional and only used
        # when a document export is requested from config.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow python-docx

      - name: Install CJK fonts for digest images
        # The poster and long image are rendered with Pillow; without a CJK font the
        # renderer skips both and the email would silently lose them.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra || sudo apt-get install -y fonts-wqy-zenhei

      - name: Restore private research and email settings
        env:
          PRIVATE_CONFIG: ${{ secrets.RESEARCH_BRIEF_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get('PRIVATE_CONFIG', '')
          if not raw:
              raise SystemExit('Missing RESEARCH_BRIEF_CONFIG_JSON')
          config = json.loads(Path('automation/research_brief_config.example.json').read_text(encoding='utf-8-sig'))
          def merge(target, patch):
              for key, value in patch.items():
                  if isinstance(value, dict) and isinstance(target.get(key), dict):
                      merge(target[key], value)
                  else:
                      target[key] = value
          merge(config, json.loads(raw))
          Path('automation/research_brief_config.json').write_text(json.dumps(config, ensure_ascii=False), encoding='utf-8')
          email = config['recipient_email']
          print('::add-mask::' + email)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key in ['SMTP_USERNAME','SMTP_FROM_EMAIL','SMTP_TO_EMAIL','RESEARCH_BRIEF_CONTACT_EMAIL']:
                  f.write(f'{key}={email}\n')
          PY

      - name: Generate research brief
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RESEARCH_BRIEF_FROM_EMAIL: ${{ secrets.RESEARCH_BRIEF_FROM_EMAIL }}
          RESEARCH_BRIEF_TO_EMAIL: ${{ secrets.RESEARCH_BRIEF_TO_EMAIL }}
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.XIE }}
          SMTP_USE_SSL: "true"
          SMTP_STARTTLS: "false"
          SMTP_RETRIES: ${{ secrets.SMTP_RETRIES }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          IEEE_XPLORE_API_KEY: ${{ secrets.IEEE_XPLORE_API_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID }}
          ZOTERO_COLLECTION_KEY: ${{ secrets.ZOTERO_COLLECTION_KEY }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
          IMPORT_ZOTERO: ${{ github.event.inputs.import_zotero || 'false' }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: |
          EMAIL_FLAG=""
          if [ "${SEND_EMAIL}" = "false" ]; then
            EMAIL_FLAG="--no-email"
          fi
          ZOTERO_FLAG=""
          if [ "${IMPORT_ZOTERO}" = "true" ]; then
            ZOTERO_FLAG="--zotero"
          fi
          # The ledger exists so a second scheduler on the same day cannot mail twice.
          # When a run is deliberately redone - a fix landed after the mail already went,
          # say so - that guarantee is the thing being overridden, and it has to be asked
          # for by hand rather than inferred from an environment difference.
          FORCE_FLAG=""
          if [ "${FORCE_SEND}" = "true" ]; then
            FORCE_FLAG="--force-send"
          fi
          python scripts/generate_research_brief.py --days-back "${DAYS_BACK}" ${EMAIL_FLAG} ${ZOTERO_FLAG} ${FORCE_FLAG}

      - name: Upload digest images and paper attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-images-${{ github.event.inputs.days_back || 'daily' }}
          path: |
            research_briefs/images
            research_briefs/attachments
            research_briefs/latest.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist delivery ledger
        if: ${{ github.event.inputs.send_email != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in automation/recommended_history.json automation/mail_ledger.json; do
            if [ -f "$path" ]; then git add -f "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update daily delivery ledger"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
